name: ${COMPOSE_PROJECT_NAME:-cerberus}

networks:
  cerberus_net:
    driver: bridge

volumes:
  pgdata:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cerberus_net

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cerberus_net

  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ${IMAGE_NAME_BACKEND:-cerberus-backend}:${BACKEND_IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cerberus_net

  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    image: ${IMAGE_NAME_BATCH:-cerberus-batch}:${BATCH_IMAGE_TAG:-latest}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cerberus_net

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_USER_NAME_MAX_LENGTH: ${VITE_USER_NAME_MAX_LENGTH:-30}
        VITE_PASSWORD_MIN_LENGTH: ${VITE_PASSWORD_MIN_LENGTH:-8}
    image: ${IMAGE_NAME_FRONTEND:-cerberus-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerberus_net

  mailpit:
    image: axllent/mailpit
    profiles: [dev]
    networks:
      - cerberus_net
