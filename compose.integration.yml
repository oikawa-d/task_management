networks:
  cerberus_net:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.example
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cerberus_net

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cerberus_net

  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    env_file:
      - .env.example
    environment:
      BATCH_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cerberus_net
