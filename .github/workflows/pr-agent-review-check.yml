name: PRエージェントレビューチェック

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: write

jobs:
  check-review-label:
    runs-on: ubuntu-latest
    steps:
      - name: 新規コミットpush時にレビュー済みラベルを剥がす
        if: github.event.action == 'synchronize'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'reviewed-by-agent';
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: label,
              });
              core.notice(`新規コミットが検出されたため '${label}' ラベルを削除しました。再レビュー後に再度付与してください。`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: レビュー済みラベルの有無を確認
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'reviewed-by-agent';
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const hasLabel = labels.some((l) => l.name === label);
            if (!hasLabel) {
              core.setFailed(
                `PRに '${label}' ラベルが付与されていません。エージェントによるコードレビュー完了後にラベルを付与してください（新規コミットpush時は自動で剥がれます）。`
              );
            }
