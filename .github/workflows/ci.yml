name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 差分の空白エラーをチェック
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.event.pull_request.base.ref }}"...HEAD
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "初回push（比較元コミットなし）のためスキップします。"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バックエンド実装ディレクトリの有無を確認
        id: detect
        run: |
          if [ -d src/app ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 依存関係のインストール
        if: steps.detect.outputs.exists == 'true'
        run: |
          pip install ruff mypy pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ruff check
        if: steps.detect.outputs.exists == 'true'
        run: ruff check src

      - name: ruff format --check（タブインデント強制）
        if: steps.detect.outputs.exists == 'true'
        run: ruff format --check --diff src

      - name: mypy
        if: steps.detect.outputs.exists == 'true'
        run: mypy src/app

      - name: pytest --cov
        if: steps.detect.outputs.exists == 'true'
        run: pytest --cov=src/app --cov-report=term-missing

      - name: バックエンド未実装のためスキップ
        if: steps.detect.outputs.exists == 'false'
        run: echo "src/app が未作成のためバックエンドチェックをスキップします。"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: フロントエンド実装ディレクトリの有無を確認
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: ESLint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: TypeScriptチェック
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest（カバレッジ）
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test -- --coverage

      - name: フロントエンド未実装のためスキップ
        if: steps.detect.outputs.exists == 'false'
        run: echo "frontend/package.json が未作成のためフロントエンドチェックをスキップします。"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfileの有無を確認
        id: detect
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Buildx セットアップ
        if: steps.detect.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: イメージビルド
        if: steps.detect.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

      - name: Dockerfile未作成のためスキップ
        if: steps.detect.outputs.exists == 'false'
        run: echo "Dockerfile が未作成のためDockerビルドをスキップします。"
