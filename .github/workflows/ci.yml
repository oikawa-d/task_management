name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      batch: ${{ steps.detect.outputs.batch }}
      frontend: ${{ steps.detect.outputs.frontend }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - name: 実装ディレクトリの有無を確認
        id: detect
        run: |
          [ -d api/app ] && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          [ -d batch/app ] && echo "batch=true" >> "$GITHUB_OUTPUT" || echo "batch=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          [ -f api/Dockerfile ] && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 差分の空白エラーをチェック
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.event.pull_request.base.ref }}"...HEAD
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "比較元コミットが存在しない（初回push・force-push等）ためスキップします。"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: ci.ymlの構成を検証
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests/ci/test_ci_workflow.py -q

  backend-lint:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: 依存関係のインストール
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        working-directory: api
        run: ruff check app tests

      - name: ruff format --check（タブインデント強制）
        working-directory: api
        run: ruff format --check --diff app tests

      - name: mypy
        working-directory: api
        run: mypy app

  backend-test:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        auth_mode: [session, jwt]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cerberus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cerberus_test
      REDIS_URL: redis://localhost:6379/1
      AUTH_MODE: ${{ matrix.auth_mode }}
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'ci-dummy-jwt-secret' }}
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: ${{ secrets.CI_INITIAL_ADMIN_PASSWORD || 'ci-dummy-admin-password' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: 依存関係のインストール
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: alembic upgrade head
        working-directory: api
        run: alembic upgrade head

      - name: pytest --cov（80%未満で失敗）
        working-directory: api
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  frontend-lint:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScriptチェック
        working-directory: frontend
        run: npm run typecheck

  frontend-test:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        working-directory: frontend
        run: npm ci

      - name: Vitest（カバレッジ70%未満で失敗）
        working-directory: frontend
        run: npm run test -- --coverage

  batch-test:
    needs: detect
    if: needs.detect.outputs.batch == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cerberus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cerberus_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: batch/requirements.txt

      - name: 依存関係のインストール
        working-directory: batch
        run: |
          pip install ruff mypy pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt

      - name: ruff check
        working-directory: batch
        run: ruff check app tests

      - name: ruff format --check（タブインデント強制）
        working-directory: batch
        run: ruff format --check --diff app tests

      - name: mypy
        working-directory: batch
        run: mypy app

      - name: pytest --cov
        working-directory: batch
        run: pytest --cov=app --cov-report=term-missing

  batch-container-integration:
    needs: detect
    if: needs.detect.outputs.batch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: pytestをインストール
        run: |
          pip install pytest pytest-asyncio
          pip install -r batch/requirements.txt

      - name: batch専用コンテナからDB/Redisへの直接接続を検証
        env:
          RUN_BATCH_CONTAINER_INTEGRATION: '1'
        run: pytest -c batch/pytest.ini batch/tests/integration/test_container_connectivity.py -q

  docker-build:
    needs:
      - detect
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - batch-test
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx セットアップ
        uses: docker/setup-buildx-action@v3

      - name: Pythonセットアップ（Dockerfile検証）
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: backendイメージビルド
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          tags: cerberus-review-api:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: frontendイメージビルド
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: cerberus-review-frontend:ci
          push: false
          load: true
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: batchイメージビルド
        uses: docker/build-push-action@v6
        with:
          context: .
          file: batch/Dockerfile
          tags: cerberus-review-batch:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dockerfile検証テスト
        env:
          DOCKER_TEST_IMAGE_API: cerberus-review-api:ci
          DOCKER_TEST_IMAGE_FRONTEND: cerberus-review-frontend:ci
          DOCKER_TEST_IMAGE_BATCH: cerberus-review-batch:ci
        run: |
          python -m pip install pytest
          python -m pytest tests/docker/test_dockerfiles.py
