name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - name: 実装ディレクトリの有無を確認
        id: detect
        run: |
          [ -d src/app ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          [ -f Dockerfile ] && echo "docker=true" >> "$GITHUB_OUTPUT" || echo "docker=false" >> "$GITHUB_OUTPUT"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 差分の空白エラーをチェック
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.event.pull_request.base.ref }}"...HEAD
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "比較元コミットが存在しない（初回push・force-push等）ためスキップします。"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 依存関係のインストール
        run: |
          pip install ruff mypy pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ruff check
        run: ruff check src

      - name: ruff format --check（タブインデント強制）
        run: ruff format --check --diff src

      - name: mypy
        run: mypy src/app

      - name: pytest --cov
        run: pytest --cov=src/app --cov-report=term-missing

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScriptチェック
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest（カバレッジ）
        working-directory: frontend
        run: npm run test -- --coverage

  docker-build:
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx セットアップ
        uses: docker/setup-buildx-action@v3

      - name: イメージビルド
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
