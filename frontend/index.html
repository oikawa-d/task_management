<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/cerberus-icon.png" />
    <title>Cerberus</title>
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("cerberus.ui") || "null");
          const theme = saved?.state?.theme;
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (_) { /* localStorage unavailable; CSS system theme remains active */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
